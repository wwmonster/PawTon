<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>PawTON</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0e14;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 152, 234, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.2) 0%, transparent 40%),
                url('https://i.postimg.cc/Pf9CdKvD/b8573cf4-b5da-4eea-a9c5-9c6eb08cb316.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 15px 20px;
            overflow: hidden;
            touch-action: manipulation;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: env(safe-area-inset-top, 5px);
            position: relative;
            z-index: 50;
        }

        .burger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            position: relative;
            z-index: 60;
        }

        .burger-btn div {
            width: 25px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .app-name { 
            font-size: 16px; 
            color: #0098ea; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .score-container { 
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 30px; 
            font-weight: 900; 
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 30%, #0098ea 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 152, 234, 0.6));
        }

        .click-area-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .click-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .click-area::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 152, 234, 0.35) 0%, rgba(138, 43, 226, 0.2) 60%, transparent 80%);
            z-index: 1;
            pointer-events: none; 
        }

        .click-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background-color: transparent;
            background-image: url('https://i.postimg.cc/zf8L9BHY/35414e84-9648-40d4-a6bc-e322d9ae6b0c-(1).png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            cursor: pointer;
            filter: drop-shadow(0 0 20px rgba(0, 152, 234, 0.8));
            position: relative;
            z-index: 10;
            transition: transform 0.05s ease;
            touch-action: manipulation;
        }

        .click-btn.pressed { 
            transform: scale(0.88) !important; 
        }

        .plus-one {
            position: absolute;
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #0098ea;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px #0098ea;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        .plus-two {
            color: #da70d6 !important;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px #da70d6 !important;
            font-size: 36px !important;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-40px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-90px) scale(1); }
        }

        .drawer {
            position: fixed;
            top: 0; left: -100%;
            width: 75%; height: 100%;
            background-color: rgba(23, 33, 43, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .drawer.open { left: 0; }
        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2b374a; padding-bottom: 15px;
        }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        .menu-item {
            background: rgba(35, 46, 60, 0.8);
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #17212b; padding: 20px; border-radius: 15px;
            width: 85%; max-width: 320px; text-align: center;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-btn {
            background: #0098ea; color: white; border: none;
            padding: 10px; border-radius: 8px; font-weight: bold;
            width: 100%; margin-top: 10px; cursor: pointer;
        }
        .modal-btn:disabled { background: #2b374a; color: #8e8e93; cursor: not-allowed; }

        .task-item {
            background: #232e3c;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: left;
        }

        .footer { width: 100%; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
        .energy-bar, .boost-bar-container { width: 100%; height: 8px; background: rgba(44, 44, 46, 0.8); border-radius: 4px; overflow: hidden; }
        .energy-fill { width: 100%; height: 100%; background: #0098ea; transition: width 0.1s linear; }
        .boost-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #da70d6, #0098ea); transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="burger-btn" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </button>
        <div class="score-container">⚡ <span id="score">0</span></div>
        <div class="app-name">PawTON</div>
    </div>

    <div class="click-area-wrapper">
        <div class="click-area">
            <button class="click-btn" id="tap-btn"></button>
        </div>
    </div>

    <div class="footer">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#d1d1d6;">
            <span>Энергия</span>
            <span id="energy-text">500 / 500</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:12px; color:#da70d6; margin-top: 2px;">
            <span id="boost-label">Процесс X2 (100 кликов)</span>
            <span id="boost-text">0 / 100</span>
        </div>
        <div class="boost-bar-container">
            <div class="boost-fill" id="boost-fill"></div>
        </div>
    </div>

    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h3>Меню</h3>
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-item" onclick="openModal('tasks')">📋 Ежедневные задания</div>
        <div class="menu-item" onclick="openModal('bonuses')">🎁 Раздел Бонусы</div>
        <div class="menu-item" onclick="openModal('author')">👨‍💻 Автор</div>
        <div class="menu-item" onclick="openModal('sub')">📢 Подписка</div>
        <div class="menu-item" onclick="openModal('support')">💬 Техподдержка</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e){}

        const maxEnergy = 500;
        const maxBoostClicks = 100;

        let score = parseInt(localStorage.getItem('score')) || 0;
        let todayClicks = parseInt(localStorage.getItem('todayClicks')) || 0;
        let boostProgress = parseInt(localStorage.getItem('boostProgress')) || 0;
        
        let storedEnergy = parseInt(localStorage.getItem('energy'));
        let energy = (isNaN(storedEnergy) || storedEnergy === null) ? maxEnergy : storedEnergy;

        let isX2Active = false;
        let x2Timer = null;

        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tap-btn');
        const energyText = document.getElementById('energy-text');
        const energyFill = document.getElementById('energy-fill');
        const boostFill = document.getElementById('boost-fill');
        const boostText = document.getElementById('boost-text');
        const boostLabel = document.getElementById('boost-label');

        updateUI();

        function processClick(x, y) {
            let cost = isX2Active ? 2 : 1;
            
            if (energy < cost) return;

            if (tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch(err) {}
            }

            let reward = isX2Active ? 2 : 1;

            score += reward;
            energy -= cost;
            todayClicks += 1;
            
            if (!isX2Active) {
                boostProgress += 1;
                if (boostProgress >= maxBoostClicks) {
                    activateX2();
                }
            }

            saveData();
            updateUI();
            showPlusX(x, y, `+${reward}`, isX2Active);
        }

        tapBtn.addEventListener('pointerdown', (e) => {
            tapBtn.classList.add('pressed');
            processClick(e.clientX, e.clientY);
        });

        tapBtn.addEventListener('pointerup', () => tapBtn.classList.remove('pressed'));
        tapBtn.addEventListener('pointerleave', () => tapBtn.classList.remove('pressed'));

        // Восстановление 1 энергии каждые 2.5 секунды (2500 миллисекунд)
        setInterval(() => {
            if (isNaN(energy) || energy < 0) energy = 0;
            
            if (energy < maxEnergy) {
                energy += 1;
                if (energy > maxEnergy) energy = maxEnergy;
                updateUI();
                saveData();
            }
        }, 2500);

        function activateX2() {
            isX2Active = true;
            boostProgress = maxBoostClicks;
            boostLabel.innerText = "🔥 РЕЖИМ X2 АКТИВЕН!";
            
            let timeLeft = 5; // 5 секунд действия x2
            boostText.innerText = `${timeLeft}с`;
            boostFill.style.width = `100%`;

            if (x2Timer) clearInterval(x2Timer);

            x2Timer = setInterval(() => {
                timeLeft -= 1;
                boostText.innerText = `${timeLeft}с`;
                boostFill.style.width = `${(timeLeft / 5) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(x2Timer);
                    isX2Active = false;
                    boostProgress = 0;
                    boostLabel.innerText = "Процесс X2 (100 кликов)";
                    saveData();
                    updateUI();
                }
            }, 1000);
        }

        function updateUI() {
            if (isNaN(energy) || energy < 0) energy = 0;
            if (energy > maxEnergy) energy = maxEnergy;

            scoreEl.innerText = score;
            energyText.innerText = `${energy} / ${maxEnergy}`;
            energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
            
            if (!isX2Active) {
                boostText.innerText = `${boostProgress} / ${maxBoostClicks}`;
                boostFill.style.width = `${(boostProgress / maxBoostClicks) * 100}%`;
            }
        }

        function saveData() {
            localStorage.setItem('score', score);
            localStorage.setItem('energy', energy);
            localStorage.setItem('todayClicks', todayClicks);
            localStorage.setItem('boostProgress', boostProgress);
        }

        function showPlusX(x, y, text, isDouble) {
            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            if (isDouble) plusOne.classList.add('plus-two');
            plusOne.innerText = text;
            
            const rect = tapBtn.getBoundingClientRect();
            plusOne.style.left = `${x - rect.left}px`;
            plusOne.style.top = `${y - rect.top}px`;
            tapBtn.parentElement.appendChild(plusOne);
            setTimeout(() => plusOne.remove(), 800);
        }

        function toggleMenu() {
            document.getElementById('drawer').classList.toggle('open');
        }

        function openModal(type) {
            toggleMenu();
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            const today = new Date().toDateString();
            const lastDaily = localStorage.getItem('lastDaily');

            if (type === 'tasks') {
                const clickTaskDone = localStorage.getItem('task_clicks') === 'true';
                const loginTaskDone = localStorage.getItem('task_login') === today;
                
                body.innerHTML = `
                    <h3>📋 Ежедневные задания</h3>
                    <div class="task-item">
                        <div style="font-size:13px; font-weight:bold;">Сделать 100 кликов</div>
                        <div style="font-size:11px; color:#8e8e93;">Прогресс: ${todayClicks}/100 (+30 монет)</div>
                        <button class="modal-btn" ${clickTaskDone || todayClicks < 100 ? 'disabled' : ''} onclick="claimTask('clicks', 30)">
                            ${clickTaskDone ? 'Завершено' : (todayClicks >= 100 ? 'Забрать +30' : 'Не выполнено')}
                        </button>
                    </div>
                    <div class="task-item">
                        <div style="font-size:13px; font-weight:bold;">Зайти в приложение</div>
                        <div style="font-size:11px; color:#8e8e93;">Награда: +20 монет</div>
                        <button class="modal-btn" ${loginTaskDone ? 'disabled' : ''} onclick="claimTask('login', 20)">
                            ${loginTaskDone ? 'Завершено' : 'Забрать +20'}
                        </button>
                    </div>
                    <button class="modal-btn" style="background:#2b374a" onclick="closeModal()">Закрыть</button>
                `;
            } else if (type === 'bonuses') {
                const isClaimed = lastDaily === today;
                body.innerHTML = `
                    <h3>🎁 Бонусы</h3>
                    <p style="font-size:13px; color:#8e8e93;">Ежедневная награда: +15 монет</p>
                    <button class="modal-btn" ${isClaimed ? 'disabled' : ''} onclick="claimDaily()">
                        ${isClaimed ? 'Уже получено' : 'Забрать +15 монет'}
                    </button>
                    <button class="modal-btn" style="background:#2b374a" onclick="closeModal()">Закрыть</button>
                `;
            } else if (type === 'author') {
                body.innerHTML = `
                    <h3>👨‍💻 Об авторе</h3>
                    <p style="font-size:13px;">Создатель PawTON: <b>@SPBBOLT</b></p>
                    <button class="modal-btn" onclick="closeModal()">Закрыть</button>
                `;
            } else if (type === 'sub') {
                const isSubbed = localStorage.getItem('subClaimed') === 'true';
                body.innerHTML = `
                    <h3>📢 Подписка</h3>
                    <p style="font-size:13px; color:#8e8e93;">Подпишитесь на канал и получите +50 монет!</p>
                    <button class="modal-btn" onclick="goSub()" ${isSubbed ? 'disabled' : ''}>
                        ${isSubbed ? 'Вы уже подписаны' : 'Перейти в канал'}
                    </button>
                    <button class="modal-btn" style="background:#2b374a" onclick="closeModal()">Закрыть</button>
                `;
            } else if (type === 'support') {
                body.innerHTML = `
                    <h3>💬 Техподдержка</h3>
                    <p style="font-size:13px;">По всем вопросам пишите в саппорт:</p>
                    <button class="modal-btn" onclick="tg.openTelegramLink('https://t.me/SPBBOLT')">Написать в саппорт</button>
                    <button class="modal-btn" style="background:#2b374a" onclick="closeModal()">Закрыть</button>
                `;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function claimTask(type, reward) {
            score += reward;
            if (type === 'clicks') localStorage.setItem('task_clicks', 'true');
            if (type === 'login') localStorage.setItem('task_login', new Date().toDateString());
            saveData();
            updateUI();
            closeModal();
        }

        function claimDaily() {
            score += 15;
            localStorage.setItem('lastDaily', new Date().toDateString());
            saveData();
            updateUI();
            closeModal();
        }

        function goSub() {
            tg.openTelegramLink('https://t.me/pawtoncripto');
            setTimeout(() => {
                score += 50;
                localStorage.setItem('subClaimed', 'true');
                saveData();
                updateUI();
                closeModal();
            }, 3000);
        }
    </script>
</body>
</html>
